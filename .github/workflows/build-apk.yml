name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Licenses and Install Android 34
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build clone runtime dex
        shell: bash
        run: |
          set -e
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          AJ="$SDK/platforms/android-34/android.jar"
          D8="$SDK/build-tools/34.0.0/d8"
          rm -rf rt && mkdir -p rt/classes rt/dex
          javac --release 8 -cp "$AJ" -d rt/classes $(find clone-runtime-src -name '*.java')
          (cd rt/classes && jar cf ../runtime.jar com && jar cf ../stub.jar androidx)
          "$D8" --release --min-api 24 --lib "$AJ" --classpath rt/stub.jar --output rt/dex rt/runtime.jar
          cp rt/dex/classes.dex app/src/main/assets/clone_runtime.dex
          ls -l app/src/main/assets/clone_runtime.dex

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        shell: bash
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/CloneVerse-Pro.apk
          ls -lh out/CloneVerse-Pro.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: CloneVerse-Pro-APK
          path: out/CloneVerse-Pro.apk
          retention-days: 90
          if-no-files-found: error
